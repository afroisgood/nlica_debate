<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>自作自受的花蓮人 — 投票與留言</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  /* ── 漫畫爆炸 Comic Pop theme ── */
  :root {
    --paper:     #FFF4D6;
    --ink:       #111111;
    --white:     #FFFFFF;
    --red:       #F51406;
    --red-dk:    #D10F00;
    --blue:      #1F3FBF;
    --yellow:    #FFD400;
    --yellow-lt: #FFE766;
    --muted:     #555555;
    --pro-tint:  #FFF0EE;
    --opt-a:     var(--red);
    --opt-b:     var(--blue);
    --opt-c:     var(--yellow);
    --warn:      #C25E00;
    --alert:     #C8001E;
    --shadow:    5px 5px 0 var(--ink);
    --shadow-sm: 3px 3px 0 var(--ink);
    --font:      "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-num:  "Bungee", "Noto Sans TC", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html {
    background: var(--paper);
    min-height: 100%;
  }
  body {
    font-family: var(--font);
    color: var(--ink);
    min-height: 100vh;
    background-color: var(--paper);
    background-image: radial-gradient(rgba(17,17,17,0.12) 1.5px, transparent 1.7px);
    background-size: 12px 12px;
  }

  button { font-family: inherit; color: var(--ink); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, .tv-card:focus-visible {
    outline: 3px solid var(--blue); outline-offset: 2px;
  }

  /* ══════════════════════════════════════
     NICKNAME SCREEN
  ══════════════════════════════════════ */
  #nickname-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    gap: 18px;
    text-align: center;
  }
  .welcome-logo {
    width: min(340px, 92vw);
    transform: rotate(-2deg);
    margin-bottom: 8px;
  }
  .welcome-title {
    font-size: 22px;
    font-weight: 900;
    color: var(--white);
    background: var(--red);
    border: 4px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 4px 18px;
    transform: skew(-8deg);
    line-height: 1.3;
  }
  .welcome-sub {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.6;
    max-width: 300px;
  }
  #nick-input {
    width: 100%;
    max-width: 300px;
    height: 56px;
    padding: 0 18px;
    font-size: 17px;
    font-family: inherit;
    font-weight: 700;
    border-radius: 0;
    border: 4px solid var(--ink);
    background: var(--white);
    color: var(--ink);
    outline: none;
    text-align: center;
    box-shadow: var(--shadow-sm);
  }
  #nick-input::placeholder { color: var(--muted); font-weight: 500; }
  #nick-error {
    font-size: 14px;
    font-weight: 700;
    color: var(--alert);
    display: none;
    min-height: 18px;
  }
  .big-btn {
    width: 100%;
    max-width: 300px;
    height: 58px;
    border: 4px solid var(--ink);
    border-radius: 0;
    font-size: 19px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .big-btn:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--ink); }
  .big-btn.primary { background: var(--red); color: var(--white); }

  /* ══════════════════════════════════════
     MAIN APP
  ══════════════════════════════════════ */
  #app-screen { display: none; flex-direction: column; min-height: 100vh; padding-bottom: 32px; }

  /* Header */
  #app-header {
    background: var(--white);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 4px solid var(--ink);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  #header-title {
    flex: 1;
    min-width: 0;
    line-height: 0;
  }
  #header-title img {
    height: 50px;
    max-width: 100%;
    object-fit: contain;
    object-position: left center;
  }
  #nick-display {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    background: var(--yellow);
    border: 3px solid var(--ink);
    padding-left: 10px;
  }
  #nick-name-label {
    font-size: 14px;
    font-weight: 900;
    color: var(--ink);
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #change-nick-btn {
    background: none;
    border: none;
    font-size: 15px;
    cursor: pointer;
    width: 40px;
    height: 40px;
    line-height: 1;
  }

  /* Sections — each one is a comic panel */
  .app-section {
    margin: 18px 16px 0;
    padding: 16px;
    background: var(--white);
    border: 4px solid var(--ink);
    box-shadow: var(--shadow);
  }
  .section-label {
    display: inline-block;
    font-size: 17px;
    font-weight: 900;
    color: var(--ink);
    margin-bottom: 12px;
  }

  /* ── Vote Buttons ── */
  #vote-closed-notice {
    background: var(--pro-tint);
    border: 3px solid var(--alert);
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--alert);
    text-align: center;
    margin-bottom: 12px;
  }
  #vote-question {
    font-size: 18px;
    font-weight: 900;
    line-height: 1.5;
    margin-bottom: 14px;
  }
  #vote-options { display: flex; flex-direction: column; gap: 12px; }
  .opt-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 64px;
    padding: 10px 14px;
    text-align: left;
    background: var(--white);
    border: 4px solid var(--ink);
    border-radius: 0;
    box-shadow: var(--shadow-sm);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.45;
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
  }
  .opt-btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .opt-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .opt-btn.selected { box-shadow: var(--shadow); font-weight: 900; }
  .opt-btn.selected.sel-a { background: var(--opt-a); color: var(--white); }
  .opt-btn.selected.sel-b { background: var(--opt-b); color: var(--white); }
  .opt-btn.selected.sel-c { background: var(--opt-c); color: var(--ink); }
  .opt-btn.selected.sel-speaker { background: var(--yellow); color: var(--ink); }
  .opt-letter {
    flex-shrink: 0;
    width: 38px; height: 38px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--font-num);
    font-size: 18px;
    border: 3px solid var(--ink);
    color: var(--white);
  }
  .opt-a { background: var(--opt-a); }
  .opt-b { background: var(--opt-b); }
  .opt-c { background: var(--opt-c); color: var(--ink); }
  .opt-n { background: var(--white); color: var(--ink); }
  .opt-btn.selected .opt-letter { border-color: var(--white); }
  .opt-btn.selected.sel-c .opt-letter,
  .opt-btn.selected.sel-speaker .opt-letter { border-color: var(--ink); }
  #vote-hint { font-size: 14px; font-weight: 700; color: var(--muted); text-align: center; margin-top: 12px; }
  #vote-hint:empty { display: none; }
  #vote-hint strong { color: var(--ink); background: var(--yellow); padding: 0 4px; }

  /* Results of the current question (shown after voting) */
  #vote-results { display: none; flex-direction: column; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 3px dashed var(--ink); }
  #vote-results.show { display: flex; }
  .vr-title { font-size: 14px; font-weight: 900; }
  .vr-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
  .vr-row .opt-letter { width: 28px; height: 28px; font-size: 13px; }
  .vr-bar { height: 20px; border: 3px solid var(--ink); background: var(--white); overflow: hidden; }
  .vr-fill { height: 100%; width: 0%; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
  .vr-num { font-size: 13px; font-weight: 900; min-width: 5.5em; text-align: right; white-space: nowrap; }

  /* Modals (shared look) */
  #nick-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(17,17,17,0.6);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #nick-modal.open { display: flex; }
  #nick-modal-box {
    background: var(--white);
    border: 5px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
    padding: 24px 20px;
    width: min(360px, 100%);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #nick-modal-box h3 {
    font-size: 20px;
    font-weight: 900;
    color: var(--ink);
    text-align: center;
  }
  #new-nick-input {
    width: 100%;
    height: 50px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 0;
    padding: 0 14px;
    font-size: 16px;
    font-family: inherit;
    font-weight: 700;
    color: var(--ink);
    outline: none;
  }
  .nick-modal-btns { display: flex; gap: 10px; }
  .nm-btn {
    flex: 1;
    height: 50px;
    border: 3px solid var(--ink);
    border-radius: 0;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  .nm-btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .nm-btn.cancel { background: var(--white); color: var(--ink); }
  .nm-btn.ok     { background: var(--yellow); color: var(--ink); }

  /* ── Comment Input ── */
  #comment-input-wrap {
    background: var(--paper);
    border: 3px solid var(--ink);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #comment-textarea {
    background: none;
    border: none;
    outline: none;
    color: var(--ink);
    font-size: 16px;
    font-family: inherit;
    line-height: 1.5;
    resize: none;
    width: 100%;
    min-height: 72px;
  }
  #comment-textarea::placeholder { color: var(--muted); }
  .comment-input-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #char-count { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
  #char-count.warn { color: var(--warn); }
  #char-count.over { color: var(--alert); }
  #send-btn {
    background: var(--yellow);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 0;
    height: 46px;
    padding: 0 22px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  #send-btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--yellow);
    font-size: 15px;
    font-weight: 900;
    padding: 10px 22px;
    border: 3px solid var(--yellow);
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 250;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Comment Feed ── */
  #feed-section { padding: 22px 16px 24px; }
  .feed-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .feed-header .section-label {
    color: var(--yellow);
    background: var(--ink);
    padding: 2px 12px;
    transform: rotate(-2deg);
  }
  #feed-count { font-size: 13px; font-weight: 700; color: var(--ink); }

  #feed-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .feed-item {
    background: var(--white);
    border: 3px solid var(--ink);
    padding: 10px 12px;
    animation: popIn 0.2s ease;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .feed-item { animation: none; } }
  .feed-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .feed-nick { font-size: 14px; font-weight: 900; color: var(--ink); }
  .feed-time { font-size: 12px; font-weight: 700; color: var(--muted); }
  .feed-text { font-size: 15px; color: var(--ink); line-height: 1.5; word-break: break-word; }
  #feed-empty { font-size: 15px; font-weight: 700; color: var(--muted); text-align: center; padding: 32px 0; }

  .like-btn {
    background: var(--white);
    border: 2px solid var(--ink);
    border-radius: 0;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    min-height: 40px;
    padding: 0 12px;
    line-height: 1.4;
    flex-shrink: 0;
  }
  .like-btn.liked { background: var(--yellow); }
  .like-btn:active { transform: scale(0.93); }

</style>
</head>
<body>

<!-- ══════════════════════════════════════
     NICKNAME SCREEN
══════════════════════════════════════ -->
<div id="nickname-screen">
  <img class="welcome-logo" src="assets/title.webp" alt="自作自受的花蓮人 — 第四場辯論活動">
  <div class="welcome-title">歡迎參與辯論活動！</div>
  <div class="welcome-sub">請輸入一個暱稱，之後你就可以投票、留言，<br>和大家一起互動。</div>
  <input type="text" id="nick-input" placeholder="輸入你的暱稱"
         maxlength="12" autocomplete="off" autocorrect="off" spellcheck="false"/>
  <div id="nick-error">請輸入暱稱（最多 12 個字）</div>
  <button class="big-btn primary" id="nick-confirm">進入活動</button>
</div>

<!-- ══════════════════════════════════════
     MAIN APP
══════════════════════════════════════ -->
<div id="app-screen">

  <!-- Header -->
  <div id="app-header">
    <div id="header-title"><img src="assets/title.webp" alt="自作自受的花蓮人 — 第四場辯論活動"></div>
    <div id="nick-display">
      <span id="nick-name-label"></span>
      <button id="change-nick-btn" title="修改暱稱" aria-label="修改暱稱">✏️</button>
    </div>
  </div>

  <!-- Vote Section — current question (A/B/C) or speaker vote -->
  <div class="app-section" id="vote-section">
    <div class="section-label" id="vote-section-label">投票</div>
    <div id="vote-closed-notice" style="display:none;">投票目前已關閉，請等待主持人開放</div>
    <div id="vote-question"></div>
    <div id="vote-options"></div>
    <div id="vote-hint"></div>
    <div id="vote-results"></div>
  </div>

  <!-- Comment Input -->
  <div class="app-section" id="comment-section">
    <div class="section-label">留言</div>
    <div id="comment-input-wrap">
      <textarea id="comment-textarea" placeholder="輸入留言…" maxlength="100" rows="3"></textarea>
      <div class="comment-input-footer">
        <span id="char-count">0 / 100</span>
        <button id="send-btn">送出</button>
      </div>
    </div>
  </div>

  <!-- Comment Feed -->
  <div id="feed-section">
    <div class="feed-header">
      <div class="section-label" style="margin-bottom:0">所有留言</div>
      <div id="feed-count"></div>
    </div>
    <div id="feed-list">
      <div id="feed-empty">目前還沒有留言</div>
    </div>
  </div>

</div>

<!-- Change nickname modal -->
<div id="nick-modal">
  <div id="nick-modal-box">
    <h3>修改暱稱</h3>
    <input type="text" id="new-nick-input" maxlength="12"
           placeholder="輸入新暱稱" autocomplete="off"/>
    <div class="nick-modal-btns">
      <button class="nm-btn cancel" id="nick-modal-cancel">取消</button>
      <button class="nm-btn ok"     id="nick-modal-ok">確認</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
// ══════════════════════════════════════════════════════════════
// FIREBASE
// ══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyAt2bOrVKbY82mOopaE8zBarJVgXF1AI_g",
  authDomain:        "debate-timer-84877.firebaseapp.com",
  databaseURL:       "https://debate-timer-84877-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "debate-timer-84877",
  storageBucket:     "debate-timer-84877.firebasestorage.app",
  messagingSenderId: "833707572035",
  appId:             "1:833707572035:web:ecf41d924b984711e78df6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ══════════════════════════════════════════════════════════════
// 辯論題目（index.html 與 vote.html 各有一份，修改時兩邊要同步）
//   short：大螢幕用短標籤；text：手機顯示完整選項
// ══════════════════════════════════════════════════════════════
const QUESTIONS = [
  { title: "花蓮的低薪結構，是可以接受的地方現實嗎？", options: [
    { short: "接受",         text: "接受，地方條件不同，薪資本來就會不同" },
    { short: "不接受",       text: "不接受，不能用「花蓮行情」合理化低薪" },
    { short: "理解但不認命", text: "可以理解，但不能把它當成永遠不會改變的現實" },
  ]},
  { title: "你會推薦朋友晚上去東大門夜市嗎？", options: [
    { short: "會推薦",       text: "會，花蓮最推薦的晚上景點" },
    { short: "不推薦",       text: "不會，不好逛且不好吃" },
    { short: "不然去哪？",   text: "要不然花蓮晚上還可以去哪？" },
  ]},
  { title: "選舉年，當你跟家人的政治立場相反時怎麼做？", options: [
    { short: "照樣討論",     text: "同桌吃飯相遇得到，和平討論或是大吵一架" },
    { short: "避而不談",     text: "有理講不通，政治不上桌，避而不談" },
    { short: "一家親",       text: "立場相同一家親" },
  ]},
  { title: "榮獲百大伴手禮的花蓮麻糬是個令人驕傲的伴手禮嗎？", options: [
    { short: "是",           text: "是，花蓮麻糬送禮自用兩相宜" },
    { short: "不是",         text: "不是，真的不會推薦別人買" },
    { short: "好吃但沒然後", text: "麻糬好吃，但是就沒有然後了" },
  ]},
  { title: "很多人說花蓮的物價跟台北一樣，但不論如何，你覺得花蓮的物價是合理的嗎？", options: [
    { short: "合理",         text: "合理，考量花東較高的物流運輸成本與基本工資調升，售價調高符合商業邏輯。" },
    { short: "不合理",       text: "不合理，即使考慮運費與成本，花蓮物價仍高於許多西南部縣市，消費感受並不合理。" },
    { short: "沒意見",       text: "沒有意見，物價高低應由市場機制自行調節，我們應該相信價格會由「看不見的手」決定。" },
  ]},
];
const OPTION_LETTERS = ["A", "B", "C"];

// 與談人票選（觀眾投票／休息 階段）
const SPEAKER_VOTE_STAGE  = "觀眾投票／休息";
const SPEAKER_VOTE_PROMPT = "投給最能說服你，或最能代表你對未來花蓮期待的與談人";
const SPEAKERS = ["楊舒雅", "馬中原", "周欣宜", "尉　楷"];

// ══════════════════════════════════════════════════════════════
// IDENTITY  (stored in localStorage)
// ══════════════════════════════════════════════════════════════
let deviceId = localStorage.getItem("debate_device_id");
if (!deviceId) {
  deviceId = "dev_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  localStorage.setItem("debate_device_id", deviceId);
}

let nickname = localStorage.getItem("debate_nickname") || "";
let votingAllowed = true; // updated from Firebase debate/config/votingOpen

// ══════════════════════════════════════════════════════════════
// NICKNAME SCREEN
// ══════════════════════════════════════════════════════════════
const nickScreen  = document.getElementById("nickname-screen");
const appScreen   = document.getElementById("app-screen");
const nickInput   = document.getElementById("nick-input");
const nickError   = document.getElementById("nick-error");
const nickConfirm = document.getElementById("nick-confirm");

function enterApp() {
  nickScreen.style.display  = "none";
  appScreen.style.display   = "flex";
  document.getElementById("nick-name-label").textContent = nickname;
  initFirebaseListeners();
}

if (nickname) {
  enterApp();
} else {
  nickScreen.style.display = "flex";
}

nickConfirm.addEventListener("click", submitNickname);
nickInput.addEventListener("keydown", e => { if (e.key === "Enter") submitNickname(); });

function submitNickname() {
  const val = nickInput.value.trim();
  if (!val) { nickError.style.display = "block"; nickInput.focus(); return; }
  nickname = val;
  localStorage.setItem("debate_nickname", nickname);
  enterApp();
}

// ══════════════════════════════════════════════════════════════
// CHANGE NICKNAME
// ══════════════════════════════════════════════════════════════
const nickModal       = document.getElementById("nick-modal");
const newNickInput    = document.getElementById("new-nick-input");

document.getElementById("change-nick-btn").addEventListener("click", () => {
  newNickInput.value = nickname;
  nickModal.classList.add("open");
  setTimeout(() => newNickInput.focus(), 50);
});
document.getElementById("nick-modal-cancel").addEventListener("click", () =>
  nickModal.classList.remove("open"));
document.getElementById("nick-modal-ok").addEventListener("click", applyNewNick);
newNickInput.addEventListener("keydown", e => { if (e.key === "Enter") applyNewNick(); });

function applyNewNick() {
  const val = newNickInput.value.trim();
  if (!val) return;
  nickname = val;
  localStorage.setItem("debate_nickname", nickname);
  document.getElementById("nick-name-label").textContent = nickname;
  nickModal.classList.remove("open");
  showToast("暱稱已更新");
}

// ══════════════════════════════════════════════════════════════
// FIREBASE LISTENERS
// ══════════════════════════════════════════════════════════════
let commentsCache    = [];
let likesCache       = {};
const likingInFlight = new Set(); // prevent double-tap race condition

function toggleLike(commentId) {
  if (likingInFlight.has(commentId)) return; // already in-flight, ignore
  likingInFlight.add(commentId);
  const alreadyLiked = !!(likesCache[commentId] || {})[deviceId];
  const ref = db.ref(`debate/likes/${commentId}/${deviceId}`);
  (alreadyLiked ? ref.remove() : ref.set(true))
    .catch(() => {}) // silent error
    .finally(() => likingInFlight.delete(commentId));
}

function initFirebaseListeners() {
  // Which vote is live: index.html writes activeQuestion (0–4 or null) and currentStage
  db.ref("debate/config/activeQuestion").on("value", snap => {
    const q = snap.val();
    activeQuestion = typeof q === "number" && q >= 0 && q < QUESTIONS.length ? q : null;
    refreshVoteMode();
  });
  db.ref("debate/config/currentStage").on("value", snap => {
    currentStage = snap.val();
    refreshVoteMode();
  });

  // Listen to voting open/close status
  db.ref("debate/config/votingOpen").on("value", snap => {
    votingAllowed = snap.val() !== false;
    document.getElementById("vote-closed-notice").style.display = votingAllowed ? "none" : "block";
    renderVote();
  });

  // Listen to comments
  db.ref("debate/comments").orderByChild("createdAt").on("value", snap => {
    commentsCache = [];
    snap.forEach(child => {
      const c = child.val();
      if (c && typeof c === 'object' && !c.deleted) commentsCache.push({ id: child.key, ...c });
    });
    renderFeed(commentsCache);
  });

  db.ref("debate/likes").on("value", snap => {
    likesCache = snap.val() || {};
    // Only patch like buttons — no full re-render
    const feedList = document.getElementById("feed-list");
    commentsCache.forEach(c => {
      const item    = feedList.querySelector(`[data-id="${c.id}"]`);
      if (!item) return;
      const likeBtn = item.querySelector(".like-btn");
      if (!likeBtn) return;
      const n     = Object.keys(likesCache[c.id] || {}).length;
      const liked = !!(likesCache[c.id] || {})[deviceId];
      likeBtn.textContent = n > 0 ? `👍 ${n}` : "👍";
      likeBtn.className   = "like-btn" + (liked ? " liked" : "");
    });
  });
}

// ══════════════════════════════════════════════════════════════
// VOTE — 每題 A/B/C（該題 15 分鐘內可改選）＋ 休息時段的與談人票選
// ══════════════════════════════════════════════════════════════
let activeQuestion = null;   // 0–4 while a question is running
let currentStage   = null;
let voteMode       = "idle"; // "question" | "speaker" | "idle"
let voteRef        = null;   // ref currently listened to for this mode
let myChoice       = null;   // "A"/"B"/"C" or speaker index
let qCounts        = [0, 0, 0];

function refreshVoteMode() {
  const mode = activeQuestion !== null ? "question"
    : currentStage === SPEAKER_VOTE_STAGE ? "speaker" : "idle";
  const key = mode === "question" ? `q${activeQuestion}` : mode;
  if (key === refreshVoteMode.lastKey) return;
  refreshVoteMode.lastKey = key;

  if (voteRef) { voteRef.off(); voteRef = null; }
  voteMode = mode; myChoice = null; qCounts = [0, 0, 0];

  if (mode === "question") {
    // Whole question node: own choice + counts for the results bars
    voteRef = db.ref(`debate/qVotes/${activeQuestion}`);
    voteRef.on("value", snap => {
      qCounts = [0, 0, 0];
      snap.forEach(v => {
        const oi = OPTION_LETTERS.indexOf((v.val() || {}).choice);
        if (oi >= 0) qCounts[oi]++;
      });
      const mine = snap.child(deviceId).val();
      myChoice = mine ? mine.choice : null;
      renderVote();
    });
  } else if (mode === "speaker") {
    // Own vote only — speaker results stay hidden until announced on the big screen
    voteRef = db.ref(`debate/speakerVotes/${deviceId}`);
    voteRef.on("value", snap => {
      const mine = snap.val();
      myChoice = mine ? mine.speaker : null;
      renderVote();
    });
  }
  renderVote();
}

function renderVote() {
  const label   = document.getElementById("vote-section-label");
  const qEl     = document.getElementById("vote-question");
  const optsEl  = document.getElementById("vote-options");
  const hint    = document.getElementById("vote-hint");
  const results = document.getElementById("vote-results");
  optsEl.innerHTML = ""; results.innerHTML = ""; results.classList.remove("show");

  if (voteMode === "idle") {
    label.textContent = "投票";
    qEl.textContent   = "目前沒有進行中的投票，請留意主持人說明。";
    hint.textContent  = "";
    return;
  }

  let options;
  if (voteMode === "question") {
    const q = QUESTIONS[activeQuestion];
    label.textContent = `第 ${activeQuestion + 1} 題`;
    qEl.textContent   = q.title;
    options = q.options.map((opt, i) => ({
      value: OPTION_LETTERS[i], badge: OPTION_LETTERS[i],
      badgeCls: `opt-${OPTION_LETTERS[i].toLowerCase()}`, selCls: `sel-${OPTION_LETTERS[i].toLowerCase()}`, text: opt.text
    }));
  } else {
    label.textContent = "與談人票選";
    qEl.textContent   = SPEAKER_VOTE_PROMPT;
    options = SPEAKERS.map((name, i) => ({
      value: i, badge: String(i + 1), badgeCls: "opt-n", selCls: "sel-speaker", text: name
    }));
  }

  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-btn" + (myChoice === opt.value ? ` selected ${opt.selCls}` : "");
    btn.disabled  = !votingAllowed;
    const badge = document.createElement("span"); badge.className = `opt-letter ${opt.badgeCls}`;
    badge.textContent = opt.badge;
    const text = document.createElement("span"); text.textContent = opt.text;
    btn.append(badge, text);
    btn.addEventListener("click", () => castVote(opt.value));
    optsEl.appendChild(btn);
  });

  const until = voteMode === "question" ? "本題結束前" : "休息結束前";
  if (myChoice === null) {
    hint.textContent = `${until}都可以改選`;
  } else {
    const chosen = voteMode === "question" ? myChoice : SPEAKERS[myChoice];
    hint.innerHTML = "";
    hint.append("你目前選了 ");
    const strong = document.createElement("strong"); strong.textContent = chosen;
    hint.append(strong, `，${until}都可以改選`);
  }

  // Phone shows the question's live ratio once this device has voted
  if (voteMode === "question" && myChoice !== null) {
    const total = qCounts.reduce((a, b) => a + b, 0);
    const title = document.createElement("div"); title.className = "vr-title";
    title.textContent = `目前投票比例（共 ${total} 票）`;
    results.appendChild(title);
    QUESTIONS[activeQuestion].options.forEach((opt, i) => {
      const pct = total > 0 ? Math.round(qCounts[i] / total * 100) : 0;
      const cls = `opt-${OPTION_LETTERS[i].toLowerCase()}`;
      const row = document.createElement("div"); row.className = "vr-row";
      const badge = document.createElement("span"); badge.className = `opt-letter ${cls}`;
      badge.textContent = OPTION_LETTERS[i];
      const bar  = document.createElement("div"); bar.className = "vr-bar";
      const fill = document.createElement("div"); fill.className = `vr-fill ${cls}`;
      fill.style.width = pct + "%";
      bar.appendChild(fill);
      const num = document.createElement("span"); num.className = "vr-num";
      num.textContent = `${qCounts[i]} 票・${pct}%`;
      row.append(badge, bar, num);
      results.appendChild(row);
    });
    results.classList.add("show");
  }
}

function castVote(value) {
  if (!votingAllowed) { showToast("投票已關閉"); return; }
  if (myChoice === value) return; // already selected
  if (voteMode === "question") {
    db.ref(`debate/qVotes/${activeQuestion}/${deviceId}`).set({
      nickname: nickname, choice: value, updatedAt: Date.now()
    }).catch(() => showToast("投票失敗，請重試"));
    showToast(`已投票：${value}`);
  } else if (voteMode === "speaker") {
    db.ref(`debate/speakerVotes/${deviceId}`).set({
      nickname: nickname, speaker: value, updatedAt: Date.now()
    }).catch(() => showToast("投票失敗，請重試"));
    showToast(`已投票：${SPEAKERS[value]}`);
  }
}

// ══════════════════════════════════════════════════════════════
// COMMENT INPUT
// ══════════════════════════════════════════════════════════════
const textarea  = document.getElementById("comment-textarea");
const charCount = document.getElementById("char-count");
const sendBtn   = document.getElementById("send-btn");
const MAX_LEN   = 100;

textarea.addEventListener("input", () => {
  const len = textarea.value.length;
  charCount.textContent = `${len} / ${MAX_LEN}`;
  charCount.className   = len >= MAX_LEN ? "over" : len >= 80 ? "warn" : "";
  sendBtn.disabled      = len === 0 || len > MAX_LEN;
});

sendBtn.addEventListener("click", submitComment);
textarea.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submitComment();
});

async function submitComment() {
  const text = textarea.value.trim();
  if (!text || text.length > MAX_LEN) return;

  sendBtn.disabled = true;
  try {
    await db.ref("debate/comments").push({
      nickname:  nickname,
      text:      text,
      createdAt: Date.now(),
      deleted:   false
    });
    textarea.value = "";
    charCount.textContent = "0 / 100";
    charCount.className   = "";
    showToast("留言已送出 ✓");
  } catch(e) {
    showToast("送出失敗，請重試");
    sendBtn.disabled = false;
  }
}

// ══════════════════════════════════════════════════════════════
// COMMENT FEED
// ══════════════════════════════════════════════════════════════
function renderFeed(list) {
  const feedList  = document.getElementById("feed-list");
  const feedEmpty = document.getElementById("feed-empty");
  const feedCount = document.getElementById("feed-count");

  feedCount.textContent = list.length ? `${list.length} 則留言` : "";

  if (list.length === 0) {
    feedList.innerHTML = "";
    feedList.appendChild(feedEmpty);
    return;
  }

  feedList.innerHTML = "";
  list.slice().reverse().forEach(c => {
    const item = document.createElement("div");
    item.className  = "feed-item";
    item.dataset.id = c.id;

    const meta = document.createElement("div"); meta.className = "feed-meta";
    const nick = document.createElement("span"); nick.className = "feed-nick";
    nick.textContent = c.nickname || "匿名";
    const time = document.createElement("span"); time.className = "feed-time";
    time.textContent = fmtTs(c.createdAt);
    meta.append(nick, time);

    const text = document.createElement("div"); text.className = "feed-text";
    text.textContent = c.text;

    const likeCount = Object.keys(likesCache[c.id] || {}).length;
    const liked     = !!(likesCache[c.id] || {})[deviceId];
    const likeBtn   = document.createElement("button");
    likeBtn.className   = "like-btn" + (liked ? " liked" : "");
    likeBtn.textContent = likeCount > 0 ? `👍 ${likeCount}` : "👍";
    likeBtn.addEventListener("click", () => toggleLike(c.id));

    const likeRow = document.createElement("div");
    likeRow.style.cssText = "display:flex; justify-content:flex-end; margin-top:6px;";
    likeRow.appendChild(likeBtn);

    item.append(meta, text, likeRow);
    feedList.appendChild(item);
  });
}

// ══════════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════════
function fmtTs(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
}

// ══════════════════════════════════════════════════════════════
// FIREBASE CLEANUP  — detach all listeners on page unload
// ══════════════════════════════════════════════════════════════
window.addEventListener("beforeunload", () => {
  if (voteRef) voteRef.off();
  db.ref("debate/config/activeQuestion").off();
  db.ref("debate/config/currentStage").off();
  db.ref("debate/config/votingOpen").off();
  db.ref("debate/comments").off();
  db.ref("debate/likes").off();
});
</script>
</body>
