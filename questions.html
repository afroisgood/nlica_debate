<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>提問管理 — 辯論活動</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
  /* ── 漫畫爆炸 Comic Pop theme ── */
  :root {
    --paper:     #FFF4D6;
    --ink:       #111111;
    --white:     #FFFFFF;
    --red:       #F51406;
    --red-dk:    #D10F00;
    --blue:      #1F3FBF;
    --yellow:    #FFD400;
    --muted:     #555555;
    --pro-tint:  #FFF0EE;
    --con-tint:  #EEF1FF;
    --alert:     #C8001E;
    --shadow:    5px 5px 0 var(--ink);
    --shadow-sm: 3px 3px 0 var(--ink);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--paper); min-height: 100%; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background-color: var(--paper);
    background-image: radial-gradient(rgba(17,17,17,0.12) 1.5px, transparent 1.7px);
    background-size: 12px 12px;
  }
  button { font-family: inherit; color: var(--ink); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* ── Login Screen ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
  }
  .login-logo { width: min(320px, 86vw); transform: rotate(-2deg); }
  #login-screen h1 {
    font-size: 20px; font-weight: 900;
    color: var(--yellow); background: var(--ink);
    padding: 2px 14px;
  }
  #login-pwd {
    width: min(280px, 80vw);
    height: 50px;
    background: var(--white);
    border: 4px solid var(--ink);
    box-shadow: var(--shadow-sm);
    padding: 0 14px;
    color: var(--ink);
    font-size: 16px;
    text-align: center;
    outline: none;
  }
  #login-error { font-size: 13px; font-weight: 700; color: var(--alert); display: none; }
  #login-btn {
    width: min(280px, 80vw);
    height: 52px;
    background: var(--red);
    color: var(--white);
    border: 4px solid var(--ink);
    box-shadow: var(--shadow);
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
  }
  #login-btn:active { transform: translate(4px, 4px); box-shadow: none; }
  body.logged-in #login-screen { display: none; }

  /* ── App ── */
  #app { display: none; max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }
  body.logged-in #app { display: block; }

  #page-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
  .header-logo { height: 52px; max-width: 60%; object-fit: contain; object-position: left center; }
  #page-header h1 {
    font-size: 20px; font-weight: 900;
    color: var(--white); background: var(--red);
    border: 3px solid var(--ink);
    padding: 2px 14px;
    transform: skew(-8deg);
    margin-right: auto;
  }
  #logout-btn {
    background: var(--white);
    border: 3px solid var(--ink);
    box-shadow: var(--shadow-sm);
    height: 40px;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
  }

  #stats-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    background: var(--yellow);
    border: 4px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 10px 16px;
    margin-bottom: 22px;
    font-size: 14px;
    font-weight: 700;
  }
  #stats-bar strong { font-size: 18px; font-weight: 900; }
  #clear-all-btn {
    margin-left: auto;
    background: var(--white);
    color: var(--red-dk);
    border: 3px solid var(--ink);
    height: 40px;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
  }
  #clear-all-btn:hover { background: var(--pro-tint); }

  .q-columns { display: flex; gap: 20px; }
  @media (max-width: 700px) {
    .q-columns { flex-direction: column; }
    .header-logo { display: none; }
  }
  .q-column {
    flex: 1; min-width: 0;
    background: var(--white);
    border: 4px solid var(--ink);
    box-shadow: var(--shadow);
    padding: 16px;
  }
  .q-column-title {
    display: inline-block;
    font-size: 17px; font-weight: 900;
    color: var(--white);
    border: 3px solid var(--ink);
    padding: 1px 12px;
    transform: skew(-8deg);
    margin-bottom: 14px;
  }
  .q-column-title.pro { background: var(--red); }
  .q-column-title.con { background: var(--blue); }

  .q-item {
    border: 3px solid var(--ink);
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .q-column:first-child .q-item { background: var(--pro-tint); }
  .q-column:last-child  .q-item { background: var(--con-tint); }
  .q-item.drawn { opacity: 0.5; }
  .q-text { flex: 1; font-size: 15px; font-weight: 500; line-height: 1.5; word-break: break-word; }
  .q-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .q-badge {
    font-size: 12px;
    background: var(--ink);
    color: var(--yellow);
    padding: 1px 8px;
    font-weight: 900;
    white-space: nowrap;
  }
  .q-del {
    background: var(--white);
    border: 2px solid var(--ink);
    color: var(--alert);
    width: 36px; height: 36px;
    font-size: 15px;
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
  }
  .q-del:hover { background: var(--pro-tint); }
  .q-empty { color: var(--muted); font-size: 14px; font-weight: 700; text-align: center; padding: 24px 0; }
</style>
</head>
<body>

<div id="login-screen">
  <img class="login-logo" src="assets/title.webp" alt="自作自受的花蓮人 — 第四場辯論活動">
  <h1>🔒 提問管理</h1>
  <input type="password" id="login-pwd" placeholder="輸入管理員密碼" autocomplete="off"/>
  <div id="login-error">密碼錯誤</div>
  <button id="login-btn">登入</button>
</div>

<div id="app">
  <div id="page-header">
    <img class="header-logo" src="assets/title.webp" alt="自作自受的花蓮人 — 第四場辯論活動">
    <h1>觀眾提問管理</h1>
    <button id="logout-btn">登出</button>
  </div>

  <div id="stats-bar">
    <span>正方 <strong id="stat-pro">0</strong> 則</span>
    <span>反方 <strong id="stat-con">0</strong> 則</span>
    <span>已抽 <strong id="stat-drawn">0</strong> 則</span>
    <button id="clear-all-btn">清空全部提問</button>
  </div>

  <div class="q-columns">
    <div class="q-column">
      <div class="q-column-title pro">正方提問</div>
      <div id="pro-list"></div>
    </div>
    <div class="q-column">
      <div class="q-column-title con">反方提問</div>
      <div id="con-list"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
// ══════════════════════════════════════════════════════════════
// FIREBASE
// ══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyAt2bOrVKbY82mOopaE8zBarJVgXF1AI_g",
  authDomain:        "debate-timer-84877.firebaseapp.com",
  databaseURL:       "https://debate-timer-84877-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "debate-timer-84877",
  storageBucket:     "debate-timer-84877.firebasestorage.app",
  messagingSenderId: "833707572035",
  appId:             "1:833707572035:web:ecf41d924b984711e78df6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ══════════════════════════════════════════════════════════════
// LOGIN GATE
// ══════════════════════════════════════════════════════════════
const ADMIN_PASSWORD = "debate2026";
const loginPwd   = document.getElementById("login-pwd");
const loginError = document.getElementById("login-error");

function attemptLogin() {
  if (loginPwd.value === ADMIN_PASSWORD) {
    document.body.classList.add("logged-in");
    initFirebaseListeners();
  } else {
    loginError.style.display = "block";
    loginPwd.select();
  }
}
document.getElementById("login-btn").addEventListener("click", attemptLogin);
loginPwd.addEventListener("keydown", e => { if (e.key === "Enter") attemptLogin(); });
document.getElementById("logout-btn").addEventListener("click", () => {
  document.body.classList.remove("logged-in");
  db.ref("debate/questions").off();
});

// ══════════════════════════════════════════════════════════════
// QUESTIONS LIST
// ══════════════════════════════════════════════════════════════
let questionsCache = {};

function initFirebaseListeners() {
  db.ref("debate/questions").on("value", snap => {
    questionsCache = snap.val() || {};
    render();
  });
}

function render() {
  const visible = Object.entries(questionsCache)
    .filter(([, q]) => q && !q.hidden)
    .sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));

  const pro = visible.filter(([, q]) => q.side === "正方");
  const con = visible.filter(([, q]) => q.side === "反方");

  document.getElementById("stat-pro").textContent   = pro.length;
  document.getElementById("stat-con").textContent   = con.length;
  document.getElementById("stat-drawn").textContent = visible.filter(([, q]) => q.drawn).length;

  renderList("pro-list", pro);
  renderList("con-list", con);
}

function renderList(elId, entries) {
  const el = document.getElementById(elId);
  el.innerHTML = "";
  if (entries.length === 0) {
    el.innerHTML = "<div class='q-empty'>尚無提問</div>";
    return;
  }
  entries.forEach(([id, q]) => {
    const item = document.createElement("div");
    item.className = "q-item" + (q.drawn ? " drawn" : "");

    const text = document.createElement("div");
    text.className = "q-text";
    text.textContent = q.text;

    const meta = document.createElement("div");
    meta.className = "q-meta";
    if (q.drawn) {
      const badge = document.createElement("span");
      badge.className = "q-badge";
      badge.textContent = "已抽";
      meta.appendChild(badge);
    }
    const del = document.createElement("button");
    del.className = "q-del";
    del.textContent = "✕";
    del.title = "刪除提問";
    del.addEventListener("click", () => {
      if (confirm("刪除這則提問？")) {
        db.ref(`debate/questions/${id}`).update({ hidden: true }).catch(() => {});
      }
    });
    meta.appendChild(del);

    item.append(text, meta);
    el.appendChild(item);
  });
}

document.getElementById("clear-all-btn").addEventListener("click", () => {
  if (!confirm("確定要清空所有提問嗎？此操作無法復原。")) return;
  const updates = {};
  Object.entries(questionsCache).forEach(([id, q]) => {
    if (q && !q.hidden) updates[`${id}/hidden`] = true;
  });
  if (Object.keys(updates).length > 0) {
    db.ref("debate/questions").update(updates).catch(() => {});
  }
});

window.addEventListener("beforeunload", () => {
  db.ref("debate/questions").off();
});
</script>
</body>
</html>
